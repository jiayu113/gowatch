<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GoWatch 监控面板</title>
<style>
    body { font-family: monospace; margin: 20px; background: #1e1e1e; color: #ddd; }
    h1 { color: #4fc3f7; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #444; padding: 8px; text-align: left; }
    th { background: #2d2d2d; }
    .up { color: #81c784; font-weight: bold; }
    .down { color: #e57373; font-weight: bold; }
    #meta { color: #888; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
    <h1>🛰️ GoWatch</h1>
    <div id="meta">上次刷新: <span id="time">-</span></div>
    
    <table>
        <thead>
            <tr>
                <th>Target</th>
                <th>Status</th>
                <th>Latency</th>
                <th>Error</th>
                <th>Last Check</th>
            </tr>
        </thead>
        <tbody id="body"></tbody>
    </table>

    <h2 style="color:#ffb74d;margin-top:30px;">🚨 最近告警</h2>
    <table>
        <thead>
            <tr>
                <th>时间</th>
                <th>规则</th>
                <th>目标</th>
                <th>原因</th>
            </tr>
        </thead>
        <tbody id="alerts-body"></tbody>
    </table>

<script>
// 1. 刷新“当前状态”的函数
async function refresh() {
    try {
        const resp = await fetch('/api/status');
        const data = await resp.json();
        const tbody = document.getElementById('body');
        tbody.innerHTML = '';
        for (const r of data) {
            const tr = document.createElement('tr');
            const statusClass = r.status === 'up' ? 'up' : 'down';
            tr.innerHTML = `
                <td>${r.target}</td>
                <td class="${statusClass}">${r.status.toUpperCase()}</td>
                <td>${r.latency_ms.toFixed(3)} ms</td>
                <td>${r.error || '-'}</td>
                <td>${new Date(r.timestamp).toLocaleString()}</td>
            `;
            tbody.appendChild(tr);
        }
        document.getElementById('time').textContent = new Date().toLocaleTimeString();
    } catch (e) {
        console.error(e);
    }
}

// 2. 新增：刷新“最近告警”的函数
async function refreshAlerts() {
    try {
        const resp = await fetch('/api/alerts?limit=20');
        const data = await resp.json();
        const tbody = document.getElementById('alerts-body');
        tbody.innerHTML = '';
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="color:#888;">暂无告警</td></tr>';
            return;
        }
        for (const e of data) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${new Date(e.fired_at).toLocaleString()}</td>
                <td>${e.rule_name}</td>
                <td>${e.target}</td>
                <td>${e.reason || '-'}</td>
            `;
            tbody.appendChild(tr);
        }
    } catch (e) { 
        console.error(e); 
    }
}

// 3. 页面刚打开时，立刻执行一次请求
refresh();
refreshAlerts();

// 4. 之后每隔 5 秒钟，两个表格都会自动向后台请求新数据并刷新
setInterval(refresh, 5000);
setInterval(refreshAlerts, 5000);
</script>
</body>
</html>
